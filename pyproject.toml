[project]
name = "cuvis-ai-unet"
dynamic = ["version"]
description = "Configurable U-Net (DynUNet) nodes for cuvis-ai: 2D, factorised 2.5D, and 3D hyperspectral segmentation, plus Dice and cross-entropy losses."
requires-python = ">=3.11,<3.14"
authors = [
  { name = "Anish Raj", email = "raj@cubert-gmbh.de" },
]
maintainers = [
  { name = "Cubert GmbH", email = "cuvis.ai@cubert-gmbh.de" },
]
license = { text = "Apache-2.0" }
readme = "README.md"

keywords = [
  "cuvis",
  "hyperspectral",
  "unet",
  "segmentation",
  "plugin",
  "cuvis-ai",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Operating System :: OS Independent",
]

dependencies = [
  "cuvis-ai-core>=0.7.1",
  # torch is provided transitively by cuvis-ai-core (matched to the env's CUDA
  # build); we deliberately do not re-declare it here to avoid pulling a
  # conflicting CPU wheel. See the cuvis-ai-plugin dependency-landmines note.
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov",
  "ruff",
  "mypy",
  "bandit",
  "detect-secrets",
  "pip-audit",
  "twine>=6.2.0",
]

[project.urls]
Homepage   = "https://docs.cuvis.ai/latest/"
Repository = "https://github.com/cubert-hyperspectral/cuvis-ai-unet"
Issues     = "https://github.com/cubert-hyperspectral/cuvis-ai-unet/issues"
Changelog  = "https://github.com/cubert-hyperspectral/cuvis-ai-unet/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cuvis_ai_unet*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
fallback_version = "0.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: small, fast tests that don't touch network or large data files.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
extend-select = ["ANN201", "ANN202", "ANN204"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests", "examples", "build", "dist"]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101"]

[tool.coverage.run]
source = ["cuvis_ai_unet"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
