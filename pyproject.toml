[project]
name = "cuvis-ai-unet"
dynamic = ["version"]
description = "Configurable U-Net (DynUNet) nodes for cuvis-ai: 2D, factorised 2.5D, and 3D hyperspectral segmentation, plus Dice and cross-entropy losses."
requires-python = ">=3.11,<3.14"
authors = [
  { name = "Anish Raj", email = "raj@cubert-gmbh.de" },
]
maintainers = [
  { name = "Cubert GmbH", email = "cuvis.ai@cubert-gmbh.de" },
]
license = { text = "Apache-2.0" }
readme = "README.md"

keywords = [
  "cuvis",
  "hyperspectral",
  "unet",
  "segmentation",
  "plugin",
  "cuvis-ai",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Operating System :: OS Independent",
]

dependencies = [
  "cuvis-ai-core>=0.14.1",
  "cuvis-ai-schemas>=0.8.0",
  "torch>=2.1",
  # torchvision is declared directly so the cuda-group cu128 source pin below keeps the
  # torch/torchvision pair same-build in this checkout; composed child environments receive
  # the host-mirrored build (cuvis-ai-core >= 0.12.1).
  "torchvision",
]
# cuvis-ai-augment is intentionally NOT a dependency: only the vendored
# transforms module touches it, and that module is imported exclusively through
# AugmentationCompose's `extra_transform_modules` — i.e. augment is by
# construction already installed whenever the import happens.

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov",
  "ruff",
  "mypy",
  "bandit",
  "detect-secrets",
  "pip-audit",
  "twine>=6.2.0",
]
# Runtime deps for the lentils tutorial notebooks / HF end-to-end path: `uv sync --extra notebooks`.
# `cuvis-ai-dataloader[cu3s]` pulls the `cuvis` SDK binding transitively, but its version must match
# the locally installed cuvis SDK (machine-specific), so that pin is a documented step in the
# notebooks, not a hard pin here.
notebooks = [
  "cuvis-ai-dataloader[cu3s,coco]>=0.5.0",  # universe.csv (materialized_path) vocabulary
  "cuvis-ai>=0.11",  # builtin nodes the notebooks wire (CU3SDataNode, ZScoreNormalizer, TensorBoard monitor)
  # cuvis-ai-augment (AugmentationCompose) is git-tag-released, not on PyPI, so it cannot live in
  # this extra: install it alongside, e.g.
  #   pip install "cuvis-ai-augment @ git+https://github.com/cubert-hyperspectral/cuvis-ai-augment.git@v0.3.2"
  "huggingface_hub",
  "matplotlib",
  "jupyter",
]

[project.urls]
Homepage   = "https://docs.cuvis.ai/latest/"
Repository = "https://github.com/cubert-hyperspectral/cuvis-ai-unet"
Issues     = "https://github.com/cubert-hyperspectral/cuvis-ai-unet/issues"
Changelog  = "https://github.com/cubert-hyperspectral/cuvis-ai-unet/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cuvis_ai_unet*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
fallback_version = "0.1.0"

[tool.uv]
default-groups = ["cuda"]

[dependency-groups]
# Floors live in [project].dependencies; this group only carries the cu128 index pin.
# torchvision rides along so the torch/torchvision pair stays ABI-matched (same-build)
# in this checkout - a cu128 torch next to a PyPI torchvision dies with
# "operator torchvision::nms does not exist".
cuda = ["torch", "torchvision"]

# The cu128 pin is scoped to the `cuda` dependency group (installed by default here)
# because uv also reads a git or path dependency's `[tool.uv.sources]`: an unscoped
# `torch = { index = ... }` reaches every composed child environment that pulls this
# repo from git and collides with the host-mirrored torch index there (cu130 on a
# Jetson Thor host, cpu on a CPU-only host). Consumers never install a dependency's
# groups, so the scoped pin binds nothing outside this checkout. On an aarch64
# checkout, sync without the pin: `uv sync --no-default-groups`.
[tool.uv.sources]
torch = { index = "pytorch-cu128", group = "cuda" }
torchvision = { index = "pytorch-cu128", group = "cuda" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "unit: small, fast tests that don't touch network or large data files.",
  "integration: full-stack tests (manifest loading via NodeRegistry).",
  "slow: GPU / real-data tests, skipped in CI (run with -m slow).",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
extend-select = ["ANN201", "ANN202", "ANN204"]

[tool.ruff.lint.per-file-ignores]
# Non-library code (tests, examples, tutorial helpers): return-type annotations and compact
# multi-statement setup lines are readability noise here, not defects.
"tests/**" = ["ANN201", "ANN202", "ANN204", "E501", "E702"]
"examples/**" = ["ANN201", "ANN202", "ANN204", "E702", "E501", "E402"]
"notebooks/**" = ["ANN201", "ANN202", "E702", "E501", "B905", "E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests", "examples", "build", "dist", "notebooks"]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist", "notebooks"]
skips = ["B101"]

[tool.coverage.run]
source = ["cuvis_ai_unet"]
# transforms.py is vendored from a pending cuvis-ai-augment change (tested there);
# it leaves this package once that ships upstream.
omit = ["tests/*", "examples/*", "notebooks/*", "cuvis_ai_unet/transforms.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
