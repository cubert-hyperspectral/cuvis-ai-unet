metadata:
  name: lentils_unet_binary
  description: DynUNet binary foreground segmentation on lentils
  author: Anish Raj

plugins:
- unet

nodes:
- name: DynUNet
  class_name: cuvis_ai_unet.node.dynunet.DynUNet
  hparams:
    mode: "2d"
    in_channels: 61
    num_classes: 2
    features: [16, 32, 64]

- name: DiceLoss
  class_name: cuvis_ai_unet.node.losses.DiceLoss
  hparams:
    weight: 1.0

- name: CrossEntropyLoss
  class_name: cuvis_ai_unet.node.losses.CrossEntropyLoss
  hparams:
    weight: 1.0

# `data` (cube) and `targets` (mask) are supplied by the datamodule batch and
# routed to input ports by name; only logits needs an explicit connection.
connections:
- source: DynUNet.outputs.logits
  target: DiceLoss.inputs.logits
- source: DynUNet.outputs.logits
  target: CrossEntropyLoss.inputs.logits
